plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tutiempo.poc'
    compileSdk 36

    defaultConfig {
        applicationId "com.tutiempo.poc"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "0.1-poc"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
